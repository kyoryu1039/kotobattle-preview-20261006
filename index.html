<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b171b">
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="battle-ui/assets/img/moon-arena-preview.webp" fetchpriority="high">
  <link rel="preload" as="image" href="battle-ui/assets/img/moon-arena-mobile.webp" media="(max-width:600px)" fetchpriority="low">
  <link rel="preload" as="image" href="battle-ui/assets/img/moon-arena.webp" media="(min-width:601px)" fetchpriority="low">
  <title>ことばバトル — WORD DUEL</title>
  <link rel="stylesheet" href="battle-ui/styles/tokens.css?v=20261007-textfit">
  <link rel="stylesheet" href="battle-ui/ui.css?v=20261007-textfit">
  <link rel="stylesheet" href="battle-ui/styles/cards.css?v=20261007-textfit">
  <link rel="stylesheet" href="battle-ui/styles/battle.css?v=20261007-textfit">
  <link rel="stylesheet" href="battle-ui/styles/mockup.css?v=20261007-textfit">
  <script defer src="battle-ui/data.js?v=20261007-textfit"></script>
  <script defer src="battle-ui/engine.js?v=20261007-textfit"></script>
  <script defer src="battle-ui/presentation.js?v=20261007-textfit"></script>
  <script defer src="battle-ui/view.js?v=20261007-textfit"></script>
  <script defer src="battle-ui/effects.js?v=20261007-textfit"></script>
  <script defer src="battle-ui/app.js?v=20261007-textfit"></script>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
  <header class="masthead">
    <a class="brand" href="index.html" aria-label="ことばアーケードに戻る"><span class="brand-mark">言</span><span>ことばバトル<small>カード × じゃんけん</small></span></a>
    <nav><button class="text-button" id="rulesButton">遊び方</button><button class="icon-button" id="settingsButton" aria-label="音と演出の設定">⚙</button></nav>
  </header>
  <main>
    <section id="setupScreen" class="setup-screen">
      <div class="intro"><div><div class="setup-title-row"><h1>チーム編成</h1><span class="cpu-mode">CPU対戦</span></div><p class="intro-copy">入れ替える枠を選び、カードをタップ</p></div></div>
      <section class="team-panel" data-side="A" aria-labelledby="teamHeading"><h2 id="teamHeading" class="sr-only">あなたの3枚</h2><div id="teamSlots" class="team-slots"></div><button id="randomTeam" class="subtle-button" type="button"><span aria-hidden="true">↻</span> 3枚おまかせ</button><p class="cpu-note sr-only">相手は毎回ランダム</p></section>
      <section class="collection" aria-labelledby="collectionHeading"><p id="selectionTarget" class="selection-target sr-only" role="status">1枚目にセットするカードを選ぶ</p><div class="collection-heading"><h2 id="collectionHeading">カード一覧 <span>32枚</span></h2><label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="ことばを探す" aria-label="ことばを検索"></label></div><div id="typeFilters" class="filters" aria-label="タイプで絞り込む"></div><div id="wordGrid" class="word-grid"></div><p id="emptySearch" class="empty-search" hidden>そのことばは見つかりませんでした。</p></section>
      <div class="setup-dock"><p class="match-summary"><span>あなたの3枚</span><b>VS</b><span>ランダムCPU</span></p><button id="startBattle" class="primary-button">この3枚で対戦 <span>↗</span></button></div>
    </section>
    <section id="battleScreen" class="battle-screen" hidden></section>
    <section id="resultScreen" class="result-screen" hidden><p class="eyebrow">対戦結果</p><h1 id="resultTitle">YOU WIN</h1><p id="resultCopy"></p><div id="resultCards" class="result-cards"></div><div class="result-actions"><button id="rematchButton" class="primary-button">同じチームで再戦 ↗</button><button id="backToSetup" class="subtle-button">編成を変える</button><a href="index.html" class="text-button">アーケードへ</a></div></section>
  </main>
  <dialog id="panelDialog" class="panel-dialog"><div class="dialog-head"><p class="eyebrow" id="dialogLabel"></p><button id="closeDialog" class="icon-button" aria-label="閉じる">×</button></div><div id="dialogContent"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
